[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-dkg"
version = "0.1.9"
description = "LangChain memory and retriever backed by OriginTrail DKG v10 Working Memory"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["langchain", "dkg", "origintrail", "knowledge-graph", "memory", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=1.3.3,<2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "langchain>=1.0",
    "langchain-openai>=1.0",
]

[project.urls]
Repository = "https://github.com/haroldboom/dkg-langchain"
Documentation = "https://github.com/haroldboom/dkg-langchain#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_dkg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# The integration module sets a skipif pytestmark before its imports.
"tests/integration/*" = ["E402"]
# The demo script installs a warnings sink before importing langchain.
"examples/demo_video.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
