[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-dkg"
version = "0.1.0"
description = "LangChain memory and retriever backed by OriginTrail DKG v10 Working Memory"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["langchain", "dkg", "origintrail", "knowledge-graph", "memory", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=0.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
]

[project.urls]
Repository = "https://github.com/haroldboom/dkg-langchain"
Documentation = "https://github.com/haroldboom/dkg-langchain#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_dkg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
